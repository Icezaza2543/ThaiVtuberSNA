<template id="view-network">
  <svg class="icon-definitions" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 5c-3-2-6-2-10-1v15c4-1 7-1 10 1 3-2 6-2 10-1V4c-4-1-7-1-10 1Zm0 0v15"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3Z"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  </defs></svg>
  <header class="header">
    <div class="brand-section"><span class="brand-icon" aria-hidden="true"></span><div>
      <h1 class="brand-title">Thai VTuber <span>Constellation</span></h1>
      <p class="brand-subtitle">Audience Network Observatory</p>
    </div></div>
    <div class="header-context"><span class="signal-dot"></span><span id="scenePeriod">All-time · dated evidence</span></div>
    <nav class="header-actions" aria-label="Observatory navigation">
      <button id="btnSearch" class="btn-info" aria-label="Search creators"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><span class="action-label">Search</span><kbd>/</kbd></button>
      <button id="btnInfoModal" class="btn-info" aria-label="Methodology" aria-haspopup="dialog"><svg class="icon" aria-hidden="true"><use href="#i-info"/></svg><span class="action-label">Methodology</span></button>
      <a href="?view=research" class="btn-info" aria-label="Research view"><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg><span class="action-label">Research</span></a>
    </nav>
  </header>
  <main class="main-container">
    <section class="graph-container" id="canvasContainer" aria-label="Thai VTuber audience network">
      <canvas id="networkCanvas" tabindex="0" aria-label="Creator constellation. Use search to select a creator. Arrow keys pan; plus and minus zoom."></canvas>
    </section>
    <div class="scene-status" aria-live="polite">
      <div><strong id="statVtubers">—</strong><span>virtual creators visible</span><span id="productionCount" hidden></span></div>
      <div><strong id="statEdges">—</strong><span>connections visible</span></div>
      <div class="secondary-stat"><strong id="statCommunities">—</strong><span>selection-time groups</span></div>
      <div class="secondary-stat"><strong id="statTopBridge">—</strong><span>highest bridge position · dataset</span></div>
    </div>
    <p class="graph-message" id="graphMessage" role="status">Loading constellation…</p>
    <p class="graph-tooltip" id="graphTooltip" role="tooltip" hidden></p>
    <button id="btnControls" class="btn-info drawer-toggle" aria-controls="controlDock" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="#i-filter"/></svg>Filters & timeline</button>
    <aside class="controls-panel" id="controlDock" aria-label="Network controls">
      <div class="panel-title"><h2>Explore the constellation</h2><button id="btnCloseControls" class="icon-button drawer-close" aria-label="Close filters"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></div>
      <div class="search-box"><label for="searchInput" class="filter-label">Find a creator</label><div class="search-field"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><input type="search" id="searchInput" class="search-input" placeholder="ชื่อ VTuber / @handle" autocomplete="off" aria-controls="searchResults"></div><div id="searchResults" class="search-results" aria-label="Matching creators"></div></div>
      <section class="timeline-section" aria-label="Broadcast chronology">
        <div class="section-heading"><label for="timeSlider">Broadcast chronology</label><span id="temporalCurrentLabel">All-Time (Dated)</span></div>
        <input type="range" id="timeSlider" class="slider timeline-slider" min="0" max="7" value="7" step="1">
        <div class="timeline-ticks" aria-label="Choose observation period">
          <button data-step="0">2020</button><button data-step="1">2021</button><button data-step="2">2022</button><button data-step="3">2023</button><button data-step="4">2024</button><button data-step="5">2025</button><button data-step="6">2026 <small>YTD</small></button><button data-step="7" aria-pressed="true">All</button>
        </div>
        <div class="timeline-actions"><button id="btnPlayTimeline" class="btn-info" aria-pressed="false"><svg id="playIcon" class="icon" aria-hidden="true"><use href="#i-play"/></svg><span id="playText">Play</span></button><button id="btnToggleTimeMode" class="btn-info" aria-pressed="true"><span id="timeModeText">Cumulative</span></button></div>
        <p class="note" id="temporalCoverage" role="status">Unknown history is not confirmed absence.</p>
        <div id="temporalAnalyticsPanel" class="temporal-analytics" style="display:none">
          <h3>Community evolution · <span id="analyticsYearLabel">—</span></h3><span id="analyticsFlagBadge" class="badge">—</span>
          <dl><dt>Communities / modularity</dt><dd id="analyticsCommsVal">—</dd><dt>Observed retention (t → t+1)</dt><dd id="analyticsRetainedVal">—</dd></dl>
          <div id="analyticsLineageEvents"></div><p class="note">Observed evidence, not causal migration.</p>
        </div>
      </section>
      <div class="filter-group"><label for="agencyFilter" class="filter-label">Agency / group at selection</label><select id="agencyFilter" class="filter-select"><option value="ALL">All groups</option></select></div>
      <div class="filter-group"><label for="edgeTypeFilter" class="filter-label">Relationship evidence</label><select id="edgeTypeFilter" class="filter-select"><option value="audience_overlap">Audience overlap · white</option><option value="collaboration">Collaboration · violet</option><option value="production_credit">Production credit → · amber dashed</option></select></div>
        <div class="filter-group"><label for="metricSelect" class="filter-label">Connection metric</label><select id="metricSelect" class="filter-select"><option value="shared_viewers">Shared viewers · count</option><option value="overlap_coefficient">Overlap coefficient · %</option><option value="jaccard">Jaccard similarity · %</option></select></div>
      <div class="slider-container"><label for="thresholdSlider" class="filter-label">Minimum connection weight <output id="sliderValue">5</output></label><input type="range" id="thresholdSlider" class="slider" min="1" max="100" value="5"></div>
      <button id="btnToggleBridges" class="btn-toggle-bridge" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-star"/></svg>Spotlight bridge creators</button>
      <details class="advanced"><summary>Advanced controls</summary><div class="advanced-content">
        <div class="filter-group"><label for="tierFilter" class="filter-label">Subscriber tier</label><select id="tierFilter" class="filter-select"><option value="ALL">All tiers</option><option value="S">S · 100k or more</option><option value="A">A · 50k or more</option><option value="B">B · 10k or more</option><option value="C">C · 1k or more</option><option value="D">D · below 1k</option></select></div>
        <div class="slider-container"><label for="repulsionSlider" class="filter-label">Node spacing <output id="repulsionValue">300</output></label><input type="range" id="repulsionSlider" class="slider" min="50" max="800" value="300"></div>
        <div class="slider-container"><label for="linkDistSlider" class="filter-label">Link distance <output id="linkDistValue">70</output></label><input type="range" id="linkDistSlider" class="slider" min="30" max="200" value="70"></div>
        <button id="btnReheatSim" class="btn-info"><svg class="icon" aria-hidden="true"><use href="#i-reset"/></svg>Settle layout</button>
      </div></details>
      <details class="legend-container"><summary>Agency color key <span id="legendSwarmCount">—</span></summary><p class="note">Color marks selection-time affiliation. Independent creators are not one agency.</p><div id="dynamicLegendList" class="dynamic-legend-list"></div></details>
      <p id="activeCount" class="note">Loading creators…</p>
    </aside>
    <aside class="inspector-panel" id="inspectorPanel" aria-labelledby="inspName" inert>
      <div class="inspector-header"><span class="profile-orbit" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="#i-star"/></svg></span><button id="btnCloseInspector" class="icon-button" aria-label="Close creator profile"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></div>
      <div class="vtuber-title"><p class="eyebrow">Selected creator</p><h2 class="vtuber-name" id="inspName">Creator</h2><span class="vtuber-handle" id="inspHandle"></span></div>
      <div class="vtuber-badges"><span class="badge" id="inspAgency"></span><span class="badge" id="inspTier"></span><span class="badge" id="inspSubs"></span></div>
      <p class="note">Agency at study selection · public subscriber metadata</p>
      <section><h3>Structural centrality</h3><p class="note">Dataset-level metrics; not a measure of influence.</p><dl class="metrics-grid"><div><dt>Degree</dt><dd id="inspDegree">—</dd></div><div><dt>Bridge position</dt><dd id="inspBetweenness">—</dd></div><div><dt>PageRank</dt><dd id="inspPageRank">—</dd></div></dl></section>
      <section><h3 class="connections-title">Observed audience overlap</h3><p class="note" id="connectionPeriod">Current observation period · all recorded connections</p><div class="connections-list" id="inspConnectionsList"></div></section>
      <footer class="inspector-footer">Observed public interaction evidence · not all viewers</footer>
    </aside>
    <div class="stage-tools" aria-label="Graph view controls"><button id="btnZoomIn" class="icon-button" aria-label="Zoom in"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg></button><button id="btnZoomOut" class="icon-button" aria-label="Zoom out"><svg class="icon" aria-hidden="true"><use href="#i-minus"/></svg></button><button id="btnFitGraph" class="icon-button" aria-label="Fit constellation"><svg class="icon" aria-hidden="true"><use href="#i-reset"/></svg></button></div>
    <footer class="stage-footer"><span>Public creators · aggregate evidence</span><span id="dataFreshness">Snapshot date unavailable</span><span class="pan-hint">Drag to explore · scroll to zoom</span></footer>
  </main>
  <div class="modal-backdrop" id="infoModal" inert>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="methodologyTitle" tabindex="-1">
      <p class="eyebrow">Reading the constellation</p><h2 id="methodologyTitle">What the connections mean</h2>
      <p>เส้นเชื่อมแสดงผู้มีปฏิสัมพันธ์สาธารณะที่พบร่วมกันระหว่างช่องในตัวอย่างที่เก็บได้ ไม่ใช่ผู้ชมทั้งหมด และไม่ใช่หลักฐานความสัมพันธ์เชิงเหตุผล</p>
      <ul>
        <li><strong>Observed overlap:</strong> Shared viewers is an intersection count; overlap coefficient divides by the smaller observed set, and Jaccard divides by the union. Temporal snapshots report comment Jaccard separately; the metric menu and profile identify that source. The threshold controls which edges are visible.</li>
        <li><strong>Time:</strong> Slices use dated interaction evidence. Cumulative includes observations up to the selected year; yearly uses that year alone. Available years follow supplied snapshots; missing periods have no invented observations.</li>
        <li><strong>Identity:</strong> Expanded snapshots use date-qualified subscriber and agency evidence; unknown attributes stay unknown. Legacy roster metadata is context only, not historical identity evidence.</li>
        <li><strong>Centrality:</strong> Profile metrics describe structural position in the supplied dataset, not influence or causal migration. The profile overlap list follows the chosen period and includes connections below the graph threshold.</li>
        <li><strong>Privacy:</strong> This public view contains creator metadata and aggregate metrics. It does not expose viewer-level rows or interaction logs.</li>
      </ul>
      <a href="?view=research" class="text-link">Explore research evidence and limitations</a><button class="btn-primary" id="btnCloseModal">กลับไปสำรวจ / Back to graph</button>
    </section>
  </div>



</template>

d-header"><h3>ผ่านไปกี่ปี ยังพบคนกลุ่มเดิม</h3></div><p class="chart-hint">สัดส่วนผู้มีปฏิสัมพันธ์ที่พบซ้ำ จากกลุ่มที่ติดตามได้ในช่วงเวลานั้น</p><canvas id="canvasSurvivalOverview" height="260"></canvas></section><section class="card"><div class="card-header"><h3>หลักฐานในแต่ละปีมีมากแค่ไหน</h3></div><p class="chart-hint">จำนวนรายการปฏิสัมพันธ์ ไม่ใช่จำนวนคน และอาจต่างกันตามการเก็บข้อมูล</p><canvas id="canvasQualityOverview" height="260"></canvas></section></div><section class="card"><div class="card-header"><h3>ช่วงที่ควรสำรวจต่อ</h3></div><p class="chart-hint">เป็นการเปลี่ยนแปลงเชิงโครงสร้าง ไม่ใช่คำอธิบายสาเหตุ ปีที่ยังไม่ครบใช้บรรยายเท่านั้น</p><div class="scrollable-table" id="breaksTable"></div></section></section><section class="tab-panel " id="panel-ecosystem"><div class="section-intro"><h2>เครือข่ายเปลี่ยนอย่างไร</h2><p>ดูจำนวนช่อง เส้นเชื่อม และการรวมกลุ่มในแต่ละปี</p></div><div class="panel-grid-2"><section class="card"><div class="card-header"><h3>จำนวนช่องที่พบในเครือข่าย</h3></div><p class="chart-hint">ช่องที่มีหลักฐานเพียงพอให้เข้าสู่เครือข่ายของปีนั้น</p><canvas id="canvasEcoFull" height="260"></canvas></section><section class="card"><div class="card-header"><h3>ความชัดของการแบ่งกลุ่ม</h3></div><p class="chart-hint">ค่าสูงขึ้นหมายถึงเส้นเชื่อมภายในกลุ่มเด่นกว่าเส้นข้ามกลุ่ม ไม่ได้บอกว่าดีหรือแย่</p><canvas id="canvasEcoModDens" height="260"></canvas></section><section class="card"><div class="card-header"><h3>ความสัมพันธ์ภายในค่าย</h3></div><p class="chart-hint">ค่าบวกเอนเอียงเข้าหาค่ายเดียวกัน ค่าใกล้ศูนย์ไม่เห็นความเอนเอียงชัด ใช้ค่าย ณ เวลาเลือกเข้าศึกษา</p><canvas id="canvasAgencyAssort" height="260"></canvas></section><section class="card"><div class="card-header"><h3>สัดส่วนเส้นเชื่อมข้ามกลุ่ม</h3></div><p class="chart-hint">ยิ่งสูง ยิ่งมีเส้นเชื่อมระหว่างกลุ่มต่าง ๆ มากเมื่อเทียบกับเส้นทั้งหมด</p><canvas id="canvasCrossComm" height="260"></canvas></section></div><section class="card"><div class="card-header"><h3>ตัวชี้วัดรายปี</h3></div><p class="chart-hint">ความหนาแน่นคือสัดส่วนเส้นที่พบต่อคู่ช่องที่เป็นไปได้ทั้งหมด ช่องในกลุ่มใหญ่สุดนับจากเส้นทางที่เชื่อมถึงกัน</p><div class="scrollable-table" id="ecosystemTable"></div></section></section><section class="tab-panel " id="panel-lineage"><div class="section-intro"><h2>กลุ่มไหนอยู่ต่อ</h2><p>ติดตามกลุ่มจากสมาชิกที่มีร่วมกัน ไม่ใช่การยืนยันว่าค่ายหรือสมาชิกย้ายกลุ่ม</p></div><section class="card"><div class="card-header"><h3>เส้นเวลาของแต่ละกลุ่ม</h3></div><p class="chart-hint">เลขบนแกนตั้งคือหมายเลขสายกลุ่ม เส้นเริ่มจากปีที่พบครั้งแรกถึงปีสุดท้ายที่ยังพบ</p><canvas id="canvasLineageTimeline" height="440"></canvas></section><section class="card"><div class="card-header"><h3>กลุ่มที่ติดตามได้</h3></div><p class="chart-hint">สถานะ “ไม่พบต่อ” หมายถึงไม่พบในช่วงหลังของชุดข้อมูล ไม่ได้แปลว่ากลุ่มยุบตัวจริง</p><div class="scrollable-table" id="lineageLifecycleTable"></div></section><section class="card"><div class="card-header"><h3>กลุ่มในปีติดกันเกี่ยวข้องกันอย่างไร</h3></div><p class="chart-hint">สมาชิกที่ใช้เทียบคือช่องครีเอเตอร์ ความเหมือนวัดจากสมาชิกที่ซ้ำกันหารด้วยสมาชิกทั้งหมดของสองกลุ่ม</p><div class="scrollable-table" id="lineageTransitionsTable"></div></section></section><section class="tab-panel " id="panel-cohorts"><div class="section-intro"><h2>พบผู้มีปฏิสัมพันธ์ซ้ำแค่ไหน</h2><p>ติดตามกลุ่มคนตามปีที่พบครั้งแรก การไม่พบซ้ำไม่ได้แปลว่าเลิกดู</p></div><section class="card"><div class="card-header"><h3>ยังพบปฏิสัมพันธ์จากคนกลุ่มเดิม</h3></div><p class="chart-hint">แยกการพบซ้ำกับช่องเดิมและกับช่องอื่น สองกลุ่มนี้อาจทับซ้อนกัน จึงไม่ควรนำมาบวก</p><canvas id="canvasCohortSurvival" height="300"></canvas></section><section class="card"><div class="card-header"><h3>ติดตามตามปีที่พบครั้งแรก</h3></div><p class="chart-hint">แต่ละแถวคือกลุ่มคนที่พบครั้งแรกในปีหนึ่ง แล้วติดตามอีกครั้งในปีเป้าหมาย</p><div class="scrollable-table" id="cohortRetentionTable"></div></section><section class="card"><div class="card-header"><h3>กลับมาพบปฏิสัมพันธ์หลังเว้นช่วง</h3></div><p class="chart-hint">รวมจำนวนการกลับมาพบตามระยะห่างระหว่างปีที่พบ ไม่ใช่จำนวนคนที่ไม่ซ้ำตลอดโครงการ</p><canvas id="canvasReactivation" height="260"></canvas></section></section><section class="tab-panel " id="panel-centrality"><div class="section-intro"><h2>ช่องไหนเชื่อมกลุ่ม</h2><p>ดูตำแหน่งเชื่อมต่อในเครือข่าย ไม่ใช่อันดับความนิยม หรืออิทธิพล</p></div><div class="bridge-search"><label for="bridgeSearch">ค้นหาชื่อช่อง</label><input id="bridgeSearch" type="search" placeholder="พิมพ์ชื่อช่องที่อยากดู"><p id="bridgeCount" role="status"></p></div><section class="card"><div class="card-header"><h3>บทบาทการเชื่อมกลุ่มของแต่ละช่อง</h3></div><p class="chart-hint">จำแนกตามเกณฑ์ของชุดข้อมูล ชื่อช่องแสดงตามต้นทางเพื่อให้ระบุตัวตนได้ถูกต้อง</p><div class="scrollable-table" id="bridgeTable"></div></section><section class="card"><div class="card-header"><h3>ตำแหน่งเชื่อมกลุ่มเปลี่ยนไปทางไหน</h3></div><p class="chart-hint">จำนวนเหตุการณ์ที่อันดับเชิงโครงสร้างสูงขึ้นหรือต่ำลง ไม่ใช่จำนวนผู้ติดตามที่เพิ่มหรือลด</p><canvas id="canvasChangePoints" height="260"></canvas></section></section><section class="tab-panel " id="panel-quality"><div class="section-intro"><h2>ข้อมูลครอบคลุมแค่ไหน</h2><p>แยกความครอบคลุมของช่อง วิดีโอ และหลักฐานที่เก็บได้ให้ชัดเจน</p></div><div class="quality-explainer"><h3>ครอบคลุมช่องมาก ไม่ได้แปลว่าเก็บครบทุกวิดีโอ</h3><p>ดูสองสัดส่วนแยกกัน: ช่องในบัญชีวิดีโอที่พบหลักฐาน และวิดีโอที่สุ่มเก็บเทียบกับวิดีโอในบัญชีทั้งหมด</p></div><section class="card"><div class="card-header"><h3>หลักฐานและความครอบคลุมรายปี</h3></div><p class="chart-hint">ระดับหลักฐานสะท้อนเกณฑ์ของชุดข้อมูล ไม่ใช่การรับรองว่าเก็บผู้ชมหรือความคิดเห็นครบ</p><div class="scrollable-table" id="qualityTable"></div></section><section class="card"><div class="card-header"><h3>แต่ละช่องมีหลักฐานระดับไหน</h3></div><p class="chart-hint">จำนวนช่องตามระดับหลักฐาน สูง ปานกลาง และต่ำ</p><canvas id="canvasTierDonut" height="280"></canvas></section><section class="card"><div class="card-header"><h3>เปลี่ยนเงื่อนไขแล้วผลต่างแค่ไหน</h3></div><p class="chart-hint">เทียบความชัดของการแบ่งกลุ่มภายใต้เงื่อนไขต่างกัน อ่านเส้นพร้อมค่าจริงในตารางด้านล่าง</p><canvas id="canvasSensitivity" height="330"></canvas></section></section><details class="method-notes" id="caveatBanner"><summary>วิธีอ่านข้อมูลและข้อจำกัดที่ควรรู้</summary><ul><li>ข้อมูลเป็นหลักฐานปฏิสัมพันธ์สาธารณะที่เก็บได้ ไม่ใช่ผู้ชมทั้งหมดหรือประวัติความคิดเห็นครบทุกครั้ง</li><li>กลุ่มในเครือข่ายคำนวณจากความสัมพันธ์ จึงไม่ใช่ค่ายโดยอัตโนมัติ ข้อมูลค่ายเป็นค่าย ณ เวลาเลือกเข้าศึกษา ไม่ใช่ประวัติสังกัดที่ยืนยันแล้ว</li><li>ปี 2026 ยังไม่ครบปี หลีกเลี่ยงการเปรียบเทียบกับปีเต็มเพื่อสรุปการเติบโตหรือการลดลง</li><li>เส้นเชื่อมและตำแหน่งเชิงโครงสร้างไม่ยืนยันความสนิท การย้ายผู้ชม หรือเหตุและผล</li><li>หน้านี้แสดงข้อมูลครีเอเตอร์สาธารณะและตัวเลขสรุปเท่านั้น ไม่มีข้อมูลผู้ชมรายบุคคล</li></ul></details></main><footer class="dash-footer"><span>ข้อมูลสรุปเพื่อการวิจัย · ไม่มีข้อมูลผู้ชมรายบุคคล</span><span id="footerGen"></span></footer></template>

<section id="methodology" class="chapter"><header class="chapter-heading"><p class="eyebrow">09 / METHODOLOGY</p><h2 tabindex="-1">จากคำถาม<br>กลับไปตรวจวิธีวิจัย</h2><p class="intro">คำจำกัดความและหลักฐานสนับสนุนอยู่ที่นี่ เพื่อให้ย้อนตรวจข้อสรุปได้โดยไม่ให้ชื่ออัลกอริทึมนำเรื่อง</p></header><div class="method-controls"><button id="expandMethods" type="button">เปิดทุกหัวข้อ</button><button id="collapseMethods" type="button">ปิดทุกหัวข้อ</button></div><div class="methods">
<details><summary>ขอบเขตการวิจัย</summary><p>แยกทะเบียน เป้าหมาย และประชากรที่สังเกตได้</p><p class="subtle">เอกสารเจาะลึก <span class="pending-value" data-field="methodology.scope.artifact">ยังไม่เชื่อมเอกสารวิเคราะห์</span></p></details>
<details><summary>การแบ่งช่วงเวลา</summary><p>รายปี สะสม และช่วงเปรียบเทียบที่มีความยาวเทียบเคียงกัน</p><p class="subtle">เอกสารเจาะลึก <span class="pending-value" data-field="methodology.time.artifact">ยังไม่เชื่อมเอกสารวิเคราะห์</span></p></details>
<details><summary>การใช้นามแฝง</summary><p>นามแฝงไม่เท่ากับข้อมูลนิรนาม และไม่ใช่จำนวนมนุษย์จริง</p><p class="subtle">เอกสารเจาะลึก <span class="pending-value" data-field="methodology.identity.artifact">ยังไม่เชื่อมเอกสารวิเคราะห์</span></p></details>
<details><summary>การสุ่มตัวอย่าง</summary><p>บันทึกสิ่งที่สุ่มได้ สิ่งที่ขาด และข้อจำกัดการตีความ</p><p class="subtle">เอกสารเจาะลึก <span class="pending-value" data-field="methodology.sampling.artifact">ยังไม่เชื่อมเอกสารวิเคราะห์</span></p></details>
<details><summary>ความสัมพันธ์แบบเข้ม · Strong overlap</summary><p>แยกการปรากฏหลายวิดีโอจากหลายข้อความในวิดีโอเดียว</p><p class="subtle">เอกสารเจาะลึก <span class="pending-value" data-field="methodology.strong.artifact">ยังไม่เชื่อมเอกสารวิเคราะห์</span></p></details>
<details><summary>การตรวจกลุ่มเครือข่าย</summary><p>กลุ่มจากโครงสร้างไม่ใช่ค่ายโดยอัตโนมัติ</p><p class="subtle">เอกสารเจาะลึก <span class="pending-value" data-field="methodology.communities.artifact">ยังไม่เชื่อมเอกสารวิเคราะห์</span></p></details>
<details><summary>การติดตามกลุ่ม · Community lineage</summary><p>ตรวจความต่อเนื่องจากสมาชิกและเกณฑ์ที่ระบุ</p><p class="subtle">เอกสารเจาะลึก <span class="pending-value" data-field="methodology.lineage.artifact">ยังไม่เชื่อมเอกสารวิเคราะห์</span></p></details>
<details><summary>การวิเคราะห์กลุ่มตามเวลา · Cohorts</summary><p>การกลับมาพบไม่ใช่การยืนยันประวัติรับชมทั้งหมด</p><p class="subtle">เอกสารเจาะลึก <span class="pending-value" data-field="methodology.cohort.artifact">ยังไม่เชื่อมเอกสารวิเคราะห์</span></p></details>
