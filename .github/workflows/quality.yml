name: Registry Quality Monitoring

# Weekly recurring check and manual audit.
# Strictly read-only: this workflow NEVER automatically verifies identities,
# never modifies canonical registry records, and never commits identity decisions.

on:
  schedule:
    - cron: '0 3 * * 1' # Every Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run unit test suite
        run: python -m unittest discover -s tests -v

      - name: Validate canonical registry
        run: python -m registry validate

      - name: Audit review queue (Priority 1 identity blockers)
        run: python -m registry queue --priority 1 --limit 50

      - name: Generate data quality and freshness report
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          python -m registry quality --as-of "$TODAY" --output reports/current

      - name: Upload quality and freshness report artifact
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-report
          path: |
            reports/current/data-quality.json
            reports/current/data-quality.csv
          retention-days: 30
