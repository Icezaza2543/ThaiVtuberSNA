name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Run Privacy Audit
        run: python scripts/privacy_audit.py

      - name: Run Git Data Security Audit
        run: python scripts/audit_data_security.py --git-only

      - name: Validate Canonical Registry
        run: python -m registry validate

      - name: Run Tests
        run: python -m pytest tests/ -q
