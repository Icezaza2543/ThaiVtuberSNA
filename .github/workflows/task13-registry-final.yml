name: Task 13 Creator Registry Final Validation

on:
  push:
    branches:
      - codex/creator-registry-consolidation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creator-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout consolidation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Rebuild canonical catalog twice
        shell: bash
        run: |
          mkdir -p /tmp/registry-final
          python scripts/build_creator_registry.py \
            --baseline docs/evidence/creator-registry-review-2026-09-19/trusted_baseline_1370.json \
            --review-bundle docs/evidence/creator-registry-review-2026-09-19/review_bundle.json \
            --resolutions data/registry/identity_resolutions.json \
            --output /tmp/registry-final/rebuild-one.json
          python scripts/build_creator_registry.py \
            --baseline docs/evidence/creator-registry-review-2026-09-19/trusted_baseline_1370.json \
            --review-bundle docs/evidence/creator-registry-review-2026-09-19/review_bundle.json \
            --resolutions data/registry/identity_resolutions.json \
            --output /tmp/registry-final/rebuild-two.json
          cmp /tmp/registry-final/rebuild-one.json /tmp/registry-final/rebuild-two.json
          cmp /tmp/registry-final/rebuild-one.json data/registry/creators.json
          python -c "from pathlib import Path; from core.creator_catalog import CreatorCatalog; CreatorCatalog.from_path(Path('/tmp/registry-final/rebuild-one.json')); CreatorCatalog.from_path(Path('/tmp/registry-final/rebuild-two.json'))"

      - name: Run privacy audit
        shell: bash
        run: |
          python scripts/privacy_audit.py | tee /tmp/registry-final/privacy.txt

      - name: Run git data-security audit
        shell: bash
        run: |
          python scripts/audit_data_security.py \
            --git-only \
            --output /tmp/registry-final/data-security.json \
            | tee /tmp/registry-final/data-security.txt

      - name: Run focused registry and consumer suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest \
            tests/test_creator_registry_baseline.py \
            tests/test_creator_review_evidence.py \
            tests/test_creator_registry_contract.py \
            tests/test_creator_catalog.py \
            tests/test_youtube_identity_client.py \
            tests/test_creator_identity_resolution.py \
            tests/test_creator_identity_resolution_task8.py \
            tests/test_creator_registry_build.py \
            tests/test_creator_registry_final_validation.py \
            tests/test_registry_consumer_migration.py \
            tests/test_frontend_public_boundary.py \
            tests/test_refactor_equivalence.py \
            tests/test_sheets_privacy_audit.py \
            tests/test_research_v2_data_contract.py \
            -q \
            --basetemp /tmp/registry-final/focused-temp \
            | tee /tmp/registry-final/focused.txt

      - name: Checkpoint release state before full suite
        shell: bash
        run: |
          git status --short
          test -z "$(git status --porcelain)"
          set +e
          python scripts/validate_dataset_release.py > /tmp/registry-final/release-before.txt 2>&1
          release_status=$?
          set -e
          echo "$release_status" > /tmp/registry-final/release-before-exit.txt

      - name: Run complete pytest suite for baseline comparison
        shell: bash
        run: |
          set +e
          set -o pipefail
          python -m pytest -q \
            --junitxml=/tmp/registry-final/full-junit.xml \
            --basetemp /tmp/registry-final/full-temp \
            | tee /tmp/registry-final/full.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > /tmp/registry-final/full-exit-code.txt
          echo "Full-suite pytest exit code: $status (final validator compares failures to Task 1 baseline)"

      - name: Verify full suite did not mutate tracked release state
        shell: bash
        run: |
          git status --short
          if [ -n "$(git status --porcelain)" ]; then
            echo "Full suite modified the checkout:"
            git diff --name-status
            git diff --check
            exit 1
          fi

          set +e
          python scripts/validate_dataset_release.py > /tmp/registry-final/release-after.txt 2>&1
          release_status=$?
          set -e
          echo "$release_status" > /tmp/registry-final/release-after-exit.txt

          cmp /tmp/registry-final/release-before-exit.txt /tmp/registry-final/release-after-exit.txt
          cmp /tmp/registry-final/release-before.txt /tmp/registry-final/release-after.txt

      - name: Write final machine-readable validation evidence
        shell: bash
        run: |
          validated_commit="$(git rev-parse HEAD)"
          python scripts/validate_creator_registry_consolidation.py \
            --rebuild-one /tmp/registry-final/rebuild-one.json \
            --rebuild-two /tmp/registry-final/rebuild-two.json \
            --focused-log /tmp/registry-final/focused.txt \
            --full-log /tmp/registry-final/full.txt \
            --data-security-json /tmp/registry-final/data-security.json \
            --validated-commit "$validated_commit" \
            --output /tmp/registry-final/post_refactor_validation.json

      - name: Final branch diff gate
        shell: bash
        run: |
          merge_base="$(git merge-base HEAD origin/main)"
          git diff "$merge_base...HEAD" --check
          test -z "$(git status --porcelain)"

      - name: Upload final validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-registry-final-validation
          path: |
            /tmp/registry-final/post_refactor_validation.json
            /tmp/registry-final/focused.txt
            /tmp/registry-final/full.txt
            /tmp/registry-final/full-junit.xml
            /tmp/registry-final/release-before.txt
            /tmp/registry-final/release-after.txt
          if-no-files-found: warn
          retention-days: 14
