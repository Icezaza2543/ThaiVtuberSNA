name: Task 10 Registry Consumer Migration

on:
  push:
    branches:
      - codex/creator-registry-consolidation
    paths:
      - core/registry.py
      - collector/thai_vtuber_registry_builder.py
      - collector/balanced_video_collector.py
      - collector/video_catalog_builder.py
      - scripts/run_batch_network_350.py
      - scripts/run_hybrid_crawler_30.py
      - tests/test_registry_consumer_migration.py
      - .github/workflows/task10-registry-consumers.yml

jobs:
  task10:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run Task 10 focused suite
        run: |
          python -m pytest \
            tests/test_registry_consumer_migration.py \
            tests/test_offline_entrypoints.py \
            tests/test_continuous_collection.py \
            tests/test_real_adapters.py \
            -q
      - name: Diff check
        run: git diff --check
