name: Task 12 Retire Legacy Registries

on:
  push:
    branches:
      - codex/creator-registry-consolidation
    paths:
      - tests/test_registry_consumer_migration.py
      - README.md
      - docs/PROJECT.md
      - data/phase1_registry_report.md
      - docs/research_v2/CURRENT_DATA_CAPABILITIES.md
      - docs/research_v2/LONG_RUNNING_RESEARCH_REPORT.md
      - docs/research_v2/OVERNIGHT_REPORT.md
      - config/settings.py
      - .github/workflows/task12-retire-legacy-registry.yml

permissions:
  contents: write

jobs:
  task12:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Remove validated obsolete registry files
        shell: bash
        run: |
          rm -f \
            data/thai_vtuber_registry.json \
            data/thai_vtuber_registry.csv \
            data/registry_vtubers.csv \
            data/master_creators.json \
            scripts/reconstruct_master_creators.py \
            scripts/update_master_with_review_and_dedup.py \
            scripts/validate_master_creators.py \
            data/entity_resolution/visual_identity_review.json \
            index.html \
            tools/visual_identity_review/index.html \
            tools/visual_identity_review/server.py \
            scripts/test_review_server.py
          rmdir tools/visual_identity_review 2>/dev/null || true

      - name: Run deletion and catalog gates
        run: |
          python -m pytest \
            tests/test_registry_consumer_migration.py \
            tests/test_creator_registry_contract.py \
            tests/test_creator_catalog.py \
            -q

      - name: Show remaining legacy references for review
        shell: bash
        run: |
          rg -n 'thai_vtuber_registry|registry_vtubers|master_creators|visual_identity_review' \
            config core collector scripts storage analytics web tests \
            README.md docs/PROJECT.md data/phase1_registry_report.md \
            docs/research_v2/CURRENT_DATA_CAPABILITIES.md \
            docs/research_v2/LONG_RUNNING_RESEARCH_REPORT.md \
            docs/research_v2/OVERNIGHT_REPORT.md || true

      - name: Diff gate
        run: git diff --check

      - name: Commit legacy retirement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            data/thai_vtuber_registry.json \
            data/thai_vtuber_registry.csv \
            data/registry_vtubers.csv \
            data/master_creators.json \
            scripts/reconstruct_master_creators.py \
            scripts/update_master_with_review_and_dedup.py \
            scripts/validate_master_creators.py \
            data/entity_resolution/visual_identity_review.json \
            index.html \
            tools/visual_identity_review \
            scripts/test_review_server.py
          git commit -m "refactor(registry): retire duplicate creator registries"
          git push origin HEAD:codex/creator-registry-consolidation
