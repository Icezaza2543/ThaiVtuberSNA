name: Task 11 Analysis Registry Migration

on:
  push:
    branches:
      - codex/creator-registry-consolidation
    paths:
      - core/creator_catalog.py
      - scripts/audit_creator_identity_mapping.py
      - scripts/audit_research_v2_consistency.py
      - scripts/audit_sheets_privacy.py
      - scripts/build_collab_registries.py
      - scripts/build_creator_ecosystem_data.py
      - scripts/build_creator_lifecycle_evidence.py
      - scripts/build_discovery_candidates_new.py
      - scripts/build_discovery_universe.py
      - scripts/build_historical_lifecycle.py
      - scripts/build_research_v2_data.py
      - scripts/build_web_data.py
      - scripts/compact_campaign_review.py
      - scripts/create_target_manifest.py
      - scripts/migrate_registry_public_graphs.py
      - scripts/update_web_with_real_data.py
      - tests/test_frontend_public_boundary.py
      - tests/test_refactor_equivalence.py
      - tests/test_research_v2_data_contract.py
      - tests/test_registry_consumer_migration.py
      - tests/test_sheets_privacy_audit.py
      - .github/workflows/task11-analysis-registry.yml

permissions:
  contents: write

jobs:
  task11:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Migrate public graph identities without changing network observations
        run: python scripts/migrate_registry_public_graphs.py

      - name: Rebuild research v2 public contract
        run: python scripts/build_research_v2_data.py

      - name: Run Task 11 focused suite
        run: |
          python -m pytest \
            tests/test_registry_consumer_migration.py \
            tests/test_frontend_public_boundary.py \
            tests/test_refactor_equivalence.py \
            tests/test_research_v2_data_contract.py \
            tests/test_research_source_integrity.py \
            tests/test_historical_catalog.py \
            tests/test_lifecycle_timeline.py \
            tests/test_sheets_privacy_audit.py \
            -q

      - name: Run consistency audits
        run: |
          python scripts/audit_creator_identity_mapping.py
          python scripts/audit_research_v2_consistency.py

      - name: Diff gate
        run: |
          git diff --check
          git status --short

      - name: Commit regenerated public artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data.json web/research/data/research_v2.json
          if [ -f data/real/analytics/network_graph.json ]; then
            git add data/real/analytics/network_graph.json
          fi
          if git diff --cached --quiet; then
            echo "No registry-derived public artifacts changed."
            exit 0
          fi
          git commit -m "data(registry): refresh canonical public creator views"
          git push origin HEAD:codex/creator-registry-consolidation
