name: Codex Task 8 Twitch Identity

on:
  push:
    branches:
      - codex/creator-registry-consolidation
    paths:
      - scripts/task8_resolve_twitch.py
      - tests/test_creator_identity_resolution_task8.py
      - .github/workflows/codex-task8-registry.yml

permissions:
  contents: write

jobs:
  task8:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout trusted registry
        shell: bash
        run: |
          git clone --depth 1 https://github.com/Icezaza2543/ThaiVirtualCreatorRegistry.git .task8/trusted

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests

      - name: Generate Twitch research evidence
        shell: bash
        run: |
          python scripts/task8_resolve_twitch.py \
            --review-bundle docs/evidence/creator-registry-review-2026-09-19/review_bundle.json \
            --previous-ledger data/registry/identity_resolutions.json \
            --trusted-registry .task8/trusted/data/registry.json \
            --trusted-link-corrections docs/evidence/creator-registry-review-2026-09-19/trusted_link_corrections.json \
            --output /tmp/identity_research_twitch.json \
            --report /tmp/task8_twitch_report.json
          cp /tmp/identity_research_twitch.json docs/evidence/creator-registry-review-2026-09-19/identity_research_twitch.json

      - name: Seal complete identity ledger
        shell: bash
        run: |
          python scripts/resolve_creator_identities.py \
            --review-bundle docs/evidence/creator-registry-review-2026-09-19/review_bundle.json \
            --baseline docs/evidence/creator-registry-review-2026-09-19/trusted_baseline_1370.json \
            --trusted-registry .task8/trusted/data/registry.json \
            --trusted-link-corrections docs/evidence/creator-registry-review-2026-09-19/trusted_link_corrections.json \
            --legacy-decisions docs/evidence/creator-registry-review-2026-09-19/legacy_visual_identity_review.json \
            --researched docs/evidence/creator-registry-review-2026-09-19/identity_research_linked.json \
            --researched docs/evidence/creator-registry-review-2026-09-19/identity_research_x.json \
            --researched docs/evidence/creator-registry-review-2026-09-19/identity_research_twitch.json \
            --merge-existing data/registry/identity_resolutions.json \
            --output /tmp/identity_resolutions.json
          cp /tmp/identity_resolutions.json data/registry/identity_resolutions.json

      - name: Validate corrected complete scope
        shell: bash
        run: |
          python scripts/resolve_creator_identities.py \
            --review-bundle docs/evidence/creator-registry-review-2026-09-19/review_bundle.json \
            --baseline docs/evidence/creator-registry-review-2026-09-19/trusted_baseline_1370.json \
            --trusted-registry .task8/trusted/data/registry.json \
            --trusted-link-corrections docs/evidence/creator-registry-review-2026-09-19/trusted_link_corrections.json \
            --legacy-decisions docs/evidence/creator-registry-review-2026-09-19/legacy_visual_identity_review.json \
            --researched docs/evidence/creator-registry-review-2026-09-19/identity_research_linked.json \
            --researched docs/evidence/creator-registry-review-2026-09-19/identity_research_x.json \
            --researched docs/evidence/creator-registry-review-2026-09-19/identity_research_twitch.json \
            --validate-only

      - name: Run focused identity tests
        run: |
          python -m pytest \
            tests/test_creator_identity_resolution.py \
            tests/test_creator_identity_resolution_task8.py \
            tests/test_youtube_identity_client.py \
            -q

      - name: Check generated diff
        run: |
          git diff --check
          git status --short

      - name: Upload Task 8 audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: task8-twitch-identity-audit
          if-no-files-found: error
          path: |
            /tmp/task8_twitch_report.json
            /tmp/identity_research_twitch.json
            /tmp/identity_resolutions.json

      - name: Commit accepted Task 8 outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/evidence/creator-registry-review-2026-09-19/identity_research_twitch.json \
            data/registry/identity_resolutions.json
          if git diff --cached --quiet; then
            echo "Task 8 outputs are already current."
            exit 0
          fi
          git commit -m "data(registry): complete accepted-account identity ledger"
          git push origin HEAD:codex/creator-registry-consolidation
