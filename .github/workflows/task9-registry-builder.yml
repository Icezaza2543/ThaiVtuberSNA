name: Task 9 Canonical Registry Builder

on:
  push:
    branches:
      - codex/creator-registry-consolidation
    paths:
      - scripts/build_creator_registry.py
      - tests/test_creator_registry_build.py
      - .github/workflows/task9-registry-builder.yml

permissions:
  contents: write

jobs:
  task9:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run builder unit tests
        run: python -m pytest tests/test_creator_registry_build.py -q

      - name: Build canonical registry twice
        shell: bash
        run: |
          mkdir -p /tmp/task9
          python scripts/build_creator_registry.py \
            --baseline docs/evidence/creator-registry-review-2026-09-19/trusted_baseline_1370.json \
            --review-bundle docs/evidence/creator-registry-review-2026-09-19/review_bundle.json \
            --resolutions data/registry/identity_resolutions.json \
            --output /tmp/task9/one.json | tee /tmp/task9/build-one.txt
          python scripts/build_creator_registry.py \
            --baseline docs/evidence/creator-registry-review-2026-09-19/trusted_baseline_1370.json \
            --review-bundle docs/evidence/creator-registry-review-2026-09-19/review_bundle.json \
            --resolutions data/registry/identity_resolutions.json \
            --output /tmp/task9/two.json | tee /tmp/task9/build-two.txt
          cmp /tmp/task9/one.json /tmp/task9/two.json
          cp /tmp/task9/one.json data/registry/creators.json

      - name: Validate catalog and focused contracts
        run: |
          python -c "from pathlib import Path; from core.creator_catalog import CreatorCatalog; c=CreatorCatalog.from_path(Path('data/registry/creators.json')); print({'creators':len(c.creators()),'accounts':len(c.accounts()),'youtube':len(c.youtube_accounts()),'sha256':c.source_fingerprint()})"
          python -m pytest tests/test_creator_registry_contract.py tests/test_creator_catalog.py tests/test_creator_registry_build.py -q

      - name: Diff gate
        run: |
          git diff --check
          git status --short

      - name: Commit canonical registry
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/registry/creators.json
          git commit -m "feat(registry): build canonical creator catalog"
          git push origin HEAD:codex/creator-registry-consolidation
