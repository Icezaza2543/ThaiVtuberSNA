name: Hub VTuber Thai discovery

# Public-source discovery only. This workflow writes first-seen observations to
# intake/raw; it never verifies personas or applies identity links automatically.
on:
  schedule:
    - cron: '20 2 * * 1,4' # Monday + Thursday, 09:20 Asia/Bangkok
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hub-vtuberthai-discovery
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Crawl directory and diff known identities
        id: crawl
        shell: bash
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)
          OUT="intake/raw/${TODAY}-run-${GITHUB_RUN_ID}-vtuberthai-directory-new.jsonl"
          SUMMARY="${OUT}.summary.json"
          python scripts/collect/collect_vtuberthai_directory.py \
            --workers 3 \
            --output "${OUT}" \
            --summary "${SUMMARY}"
          EMITTED=$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["emitted_rows"])' "${SUMMARY}")
          echo "output=${OUT}" >> "${GITHUB_OUTPUT}"
          echo "summary=${SUMMARY}" >> "${GITHUB_OUTPUT}"
          echo "emitted=${EMITTED}" >> "${GITHUB_OUTPUT}"

      - name: Upload crawl summary
        uses: actions/upload-artifact@v4
        with:
          name: hub-vtuberthai-discovery-${{ github.run_id }}
          path: ${{ steps.crawl.outputs.summary }}
          retention-days: 30

      - name: Remove empty observation file
        if: steps.crawl.outputs.emitted == '0'
        shell: bash
        run: rm -f "${{ steps.crawl.outputs.output }}"

      - name: Commit first-seen raw observations
        if: steps.crawl.outputs.emitted != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.crawl.outputs.output }}" "${{ steps.crawl.outputs.summary }}"
          git commit -m "data: crawl Hub VTuber Thai directory"
          git pull --rebase origin main
          git push origin HEAD:main
