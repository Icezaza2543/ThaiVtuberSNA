name: Validate registry
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Test identity, time and import invariants
        run: python -m pytest tests/ -q
      - name: Validate committed data
        run: python -m registry validate
      - name: Build report and snapshot
        run: |
          python -m registry report --as-of 2026-09-11 --output scratch/ci-report
          python -m registry export --as-of 2026-09-11 --output dist/ci-snapshot
